name: EAS Update (preview OTA)

# Runs after CI (Expo) succeeds on main — no duplicate test job, no rebuild APK.
on:
  workflow_run:
    workflows: ["CI (Expo)"]
    types: [completed]
    branches: [main]

concurrency:
  group: eas-update-preview
  cancel-in-progress: false

jobs:
  ota:
    name: Publish preview OTA
    runs-on: ubuntu-latest
    # Secret lives on the GitHub Environment of this name (not a repo secret).
    environment: GOOGLE_SERVICES_JSON
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Three attempts, escalating waits. The action installs eas-cli into a fresh, lockfile-less
      # temp directory (`$RUNNER_TEMP/eas-cli/<version>/<arch>`), so every transitive dependency is
      # resolved from scratch — and `browserslist` -> `electron-to-chromium`, republished every day
      # or two, takes whatever the registry advertises at that instant. The action's own remote
      # cache does not shield this: it has answered `400` on every run checked, green ones
      # included, so the install is cold every time.
      # On 2026-09-30 npm served `dist-tags.latest` = 1.5.443 while its tarball was still
      # `404 Not Found`, and the job died in 20 s, before `npm ci`, on a package that is not even
      # ours. The window is npm-side and lasts minutes — measured at up to 14 that day — so the
      # answer is patience and another attempt: two minutes, then seven, which is free in a job
      # nobody is waiting on. A retry also reuses the local tool cache if the first attempt got
      # that far. Nothing here can publish twice: only the last step does.
      - name: Install eas-cli (attempt 1/3)
        id: eas_setup_1
        uses: expo/expo-github-action@v8
        continue-on-error: true
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Wait 2 min, the registry is serving a version it does not have yet
        if: steps.eas_setup_1.outcome == 'failure'
        run: sleep 120

      - name: Install eas-cli (attempt 2/3)
        id: eas_setup_2
        if: steps.eas_setup_1.outcome == 'failure'
        uses: expo/expo-github-action@v8
        continue-on-error: true
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Wait 7 min, the registry is serving a version it does not have yet
        if: steps.eas_setup_2.outcome == 'failure'
        run: sleep 420

      # No `continue-on-error` here: if the third attempt fails too, the job fails.
      - name: Install eas-cli (attempt 3/3)
        if: steps.eas_setup_2.outcome == 'failure'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: EAS Update (preview channel, local APK runtime)
        env:
          # Optional: same bytes as ./google-services.json on your machine (EAS file var is not in env:exec).
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: ./scripts/eas-update-preview.sh "${{ github.event.workflow_run.head_sha }}"
