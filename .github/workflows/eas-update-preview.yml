name: EAS Update (preview OTA)

# Runs after CI (Expo) succeeds on main — no duplicate test job, no rebuild APK.
on:
  workflow_run:
    workflows: ["CI (Expo)"]
    types: [completed]
    branches: [main]

concurrency:
  group: eas-update-preview
  cancel-in-progress: false

jobs:
  ota:
    name: Publish preview OTA
    runs-on: ubuntu-latest
    # Secret lives on the GitHub Environment of this name (not a repo secret).
    environment: GOOGLE_SERVICES_JSON
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # Both trees, because the npm cache is keyed on what gets installed: the app's, and the
          # CLI's own lockfile below.
          cache-dependency-path: |
            package-lock.json
            tools/eas-cli/package-lock.json

      # The CLI comes from `tools/eas-cli`, not from whatever the registry calls `latest`.
      #
      # It used to come from `expo/expo-github-action`, which installs eas-cli into a fresh,
      # **lockfile-less** temp directory (`$RUNNER_TEMP/eas-cli/<version>/<arch>`) with yarn: every
      # transitive dependency was resolved from scratch at run time, and `browserslist` →
      # `electron-to-chromium` — republished every day or two — took whatever the registry
      # advertised at that instant. On 2026-09-30 that was `dist-tags.latest` = `1.5.443` while its
      # own tarball was still `404 Not Found`: the job died in 20 s, before `npm ci`, on a package
      # that is not ours, and nothing in the job could say "not that one" — the resolution belonged
      # to the temp install. Three attempts with escalating waits (2 min, then 7 min) papered over
      # the npm-side window; they are gone with the cause, and a registry flake is now a re-run.
      #
      # `npm ci` from the committed lockfile never consults a dist-tag: every version and every
      # integrity hash is written down, so a version the registry advertises but cannot serve is
      # never selected, and the CLI the OTA runs is the one reviewed in the PR that bumped it.
      # The action is gone as well — once the install left, all it still did was export the token,
      # and `EXPO_TOKEN` in the step's environment is the documented non-interactive auth.
      #
      # Installed **outside** the project tree on purpose: Metro bundles the app from the root, and
      # 160 MB of tool under it would join every file map — locally as well as here — for a job
      # whose only output is a bundle. The checkout stays exactly what the lockfile describes.
      - name: Install the pinned eas-cli
        run: |
          mkdir -p "$RUNNER_TEMP/eas-cli"
          cp tools/eas-cli/package.json tools/eas-cli/package-lock.json "$RUNNER_TEMP/eas-cli/"
          cd "$RUNNER_TEMP/eas-cli"
          npm ci --no-audit --no-fund
          echo "$RUNNER_TEMP/eas-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: EAS Update (preview channel, local APK runtime)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Optional: same bytes as ./google-services.json on your machine (EAS file var is not in env:exec).
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: ./scripts/eas-update-preview.sh "${{ github.event.workflow_run.head_sha }}"
